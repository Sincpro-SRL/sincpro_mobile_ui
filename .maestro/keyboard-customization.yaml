appId: host.exp.Exponent
name: Customized toolbar preserves native field navigation and dismissal
---
- stopApp
- openLink: "${STORYBOOK_URL}/--/?STORYBOOK_STORY_ID=patterns-forms-keyboard-navigation--custom-toolbar"
- assertVisible:
    id: "contact-name"
- tapOn:
    id: "contact-name"
- inputText: "Ada"
- tapOn: "Campo siguiente"
- inputText: "ada@example.test"
- assertVisible: "ada@example.test"
- tapOn: "Campo siguiente"
- inputText: "70012345"
- assertVisible: "70012345"
- tapOn: "Campo siguiente"
- inputText: "Notas con barra personalizada"
- assertVisible: "Notas con barra personalizada"
- takeScreenshot: customized-keyboard-notes
- tapOn: "Listo"
- assertNotVisible: "Campo siguiente"
