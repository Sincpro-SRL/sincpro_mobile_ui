- stopApp
- openLink: "${STORYBOOK_URL}/--/?STORYBOOK_STORY_ID=components-data-display-copyabletext--short-and-long-text"
- assertVisible: "Datos y texto seleccionable"
- tapOn: "Copiar referencia"
